name: CI

on:
  push:
    branches: [main, "rebuild/**"]
  pull_request:
  workflow_dispatch:

# Ordinary CI never needs Qdrant Cloud, Groq or Neo4j credentials: every job runs offline with the
# in-memory index, temporary SQLite and the test doubles under tests/. Live checks are a manual job.
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app scripts tests
      - run: pytest -q
      - name: OpenAPI contract is up to date
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- frontend/contract/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: No secret-looking values in the bundle
        run: |
          ! grep -rEl "gsk_[A-Za-z0-9]{20,}|JWT_SECRET|QDRANT_API_KEY|NEO4J_PASSWORD" dist/ || (echo "secret-like token in bundle" && exit 1)

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv venv && ./venv/bin/pip install -r requirements.txt -r requirements-dev.txt
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          CI: "true"
          E2E_PYTHON: ../venv/bin/python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  live:
    # Manual: needs real credentials as repository secrets. Read-only against Qdrant.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest tests/live -v
        env:
          LIVE_TESTS: "1"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
