server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Backend (docker-compose service name "api"); override by editing BACKEND_UPSTREAM at build time.
    set $backend http://api:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-Sent Events: no buffering, long read timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
    location = /health { proxy_pass $backend; }
    location = /ready { proxy_pass $backend; }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every other route renders index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
